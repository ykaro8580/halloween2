<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caçada da Noite</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0508;--panel:#150b10;--line:#3a2229;--ink:#ece3d0;--dim:#a89a8a;--blood:#c0243b;--acc:#c0243b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 20px #000;z-index:30}
h1,h2,h3,summary,.main{font-family:'Pirata One',Georgia,serif;font-weight:400;letter-spacing:.5px;margin:0 0 6px}
h1{font-size:54px;line-height:1;text-shadow:0 0 18px var(--blood)}h2{font-size:32px}h3{font-size:24px}
.fog{position:fixed;inset:-10%;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 85%,rgba(160,30,50,.28),transparent 55%),radial-gradient(ellipse at 85% 50%,rgba(130,130,150,.12),transparent 50%);animation:drift 28s ease-in-out infinite alternate}
.fog.b{background:radial-gradient(ellipse at 70% 90%,rgba(120,20,40,.25),transparent 50%);animation-duration:40s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(7%,-4%) scale(1.12)}}
.em{position:fixed;bottom:-8px;width:3px;height:3px;border-radius:50%;background:#e0503a;opacity:0;pointer-events:none;z-index:1;animation:rise 11s linear infinite}
@keyframes rise{10%{opacity:.8}to{transform:translate(40px,-105vh);opacity:0}}
#app{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:12px}
#hud{position:sticky;top:0;z-index:20}
.panel{position:relative;background:linear-gradient(#170c11,#0f080b);border:1px solid var(--line);border-left:3px solid var(--acc);box-shadow:inset 0 0 40px #000;padding:14px;margin-bottom:12px}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,transparent 0 23px,#6d0f1e 23px 25px,transparent 25px 71px,#8a1428 71px 74px,transparent 74px 130px);opacity:.7}
.dim,small{color:var(--dim)}small{font-size:14px}
.btn{font:inherit;min-height:44px;background:#241319;color:var(--ink);border:1px solid var(--line);padding:9px 12px;cursor:pointer;text-align:left;width:100%;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--acc);background:#33171f;box-shadow:0 0 12px -2px var(--acc)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.main{background:var(--blood);border-color:var(--blood);color:#fff;font-size:26px;text-align:center;margin-top:8px}
.btn.sel{border-color:var(--ink);background:#431b27;box-shadow:0 0 16px -2px var(--acc),inset 0 0 14px #000}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}
input{font:inherit;background:#120a0e;color:var(--ink);border:1px solid var(--line);padding:10px;width:100%;margin-top:4px}
.bar{height:11px;background:#2a1a20;margin:3px 0;border:1px solid #000}.bar i{display:block;height:100%;transition:width .35s,background .35s}
.hp i{background:linear-gradient(#e0364d,#8a1428)}.mp i{background:linear-gradient(#5b92d8,#2c5190)}.xp i{background:#8a7a3a}.xp{height:4px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:15px;margin:0;background:#0d0609f2}
.hud .row{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
#snd{position:fixed;right:10px;bottom:10px;z-index:35;width:48px;min-height:48px;text-align:center;border-radius:50%;padding:0;font-size:20px}
.stat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:8px}.ctl .btn{width:46px;padding:0;text-align:center;font-size:24px}.ctl b{min-width:34px;text-align:center;font:34px 'Pirata One',Georgia,serif;color:#fff;text-shadow:0 0 10px var(--blood)}
.pips{display:flex;gap:5px;margin:8px 0}.pips i{flex:1;height:8px;background:#2a1a20}.pips i.on{background:var(--blood)}.pips i.bossp{outline:1px solid var(--ink)}
.scn{position:relative;width:min(100%,calc(52vh*1.667));aspect-ratio:5/3;margin:0 auto 12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#000;box-shadow:inset 0 0 70px #000}
.scn svg{position:absolute;inset:0;width:100%;height:100%}
.scn::after{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(150,10,30,calc(var(--rd,0)*.03));box-shadow:inset 0 0 90px #000}
.sf{position:absolute;inset:-20% -30%;pointer-events:none;background:radial-gradient(ellipse at 30% 70%,rgba(190,50,70,.3),transparent 50%),radial-gradient(ellipse at 75% 80%,rgba(160,160,180,.16),transparent 45%);animation:drift 18s ease-in-out infinite alternate}
.sf.s2{animation-duration:30s;animation-direction:alternate-reverse;opacity:.7}
.clear .sf{animation:none;opacity:0;transition:opacity 4s}
.ttl{position:absolute;left:0;right:0;bottom:12px;text-align:center;z-index:3;padding:0 14px;text-shadow:0 2px 6px #000}
.fl{animation:fl 2.6s infinite}.wn{animation:fl 5s infinite}.ey{filter:drop-shadow(0 0 5px currentColor);animation:ey 4s infinite}.bl{animation:ey 3s infinite}
@keyframes fl{0%,100%{opacity:.55}20%{opacity:.2}30%{opacity:.7}60%{opacity:.35}80%{opacity:.65}}
@keyframes ey{0%,92%,100%{opacity:1}95%{opacity:0}}
.sh{animation:pass 9s linear infinite}@keyframes pass{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
.en{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.5s ease-in-out infinite,appear 1s both}
@keyframes breathe{50%{transform:scale(1.02,1.03)}}@keyframes appear{from{opacity:0;transform:translateY(20px)}}
.hit .en{animation:hit .4s}.lunge .en{animation:lunge .7s}.hit.lunge .en{animation:hit .4s,lunge .5s .4s}
@keyframes hit{25%{transform:translateX(-12px);filter:brightness(3) sepia(1) saturate(6)}75%{transform:translateX(10px)}}
@keyframes lunge{0%{transform:scale(1)}30%{transform:scale(.93,.9) translateY(4px)}55%{transform:scale(1.2) translateY(-6px)}100%{transform:scale(1)}}.low .en{animation:breathe 1.4s ease-in-out infinite;filter:drop-shadow(0 0 7px #a01028)}
.pop{position:absolute;top:38%;z-index:4;font:34px 'Pirata One',Georgia,serif;color:#fff;text-shadow:0 0 8px #000,0 0 12px var(--blood);animation:pop 1.2s forwards;pointer-events:none}
.pop.g{color:#9ccf7a}.pop.p{color:#ff6b7e}@keyframes pop{to{transform:translateY(-70px);opacity:0}}
.bd{width:6px;height:6px;border-radius:50%;background:#8a1428;position:absolute;top:0;animation:drip 3s infinite}@keyframes drip{to{transform:translateY(300px)}}
#lg{height:170px;overflow:auto;font-size:15px;color:var(--dim)}#lg p{margin:3px 0}#lg .g{color:#9ccf7a}#lg .r{color:#ff7a8a}#lg .x{color:#c09ae6}#lg .e{color:#e6d596}#lg b{color:var(--ink);font-weight:400}
.card{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}.ic{font-size:30px;text-align:center}
details{margin-top:8px}summary{cursor:pointer;font-size:26px}.sep{height:6px}
.fade{animation:fade .6s}@keyframes fade{from{opacity:0;filter:brightness(0)}}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0}#fx.f{animation:flf .45s}@keyframes flf{from{opacity:1}to{opacity:0}}
#scare{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;text-align:center;padding:20px}
#start{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 60%,#2a0d15,#050203 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}#start h1{font-size:clamp(44px,12vw,84px)}#start .btn{width:auto;min-width:260px}
#story{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .8s,visibility 0s .8s;outline:0}
#story.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .8s}
#story .st{font:clamp(30px,6vw,52px)/1.15 'Pirata One',Georgia,serif;color:var(--ink);max-width:760px;margin-bottom:22px}
#story .sb{font:clamp(17px,2.6vw,24px)/1.75 Georgia,serif;color:#cdbfa8;max-width:640px;min-height:9em;text-align:left}#story .sb .h{color:transparent}
#story .btn{width:auto;min-width:220px;margin-top:18px;opacity:0;transition:opacity .6s}
#story .sk2{position:absolute;bottom:18px;font-size:12px;color:#6a5a50}
#scare.on{display:flex}.rk{list-style:none;margin:6px 0;padding:0;text-align:left}.rk li{display:flex;justify-content:space-between;gap:10px;padding:4px 8px;border-bottom:1px solid var(--line)}.rk li.me{background:#431b27;color:#fff;border-left:3px solid var(--blood)}#scare::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.14;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);animation:nz .2s steps(3) infinite}@keyframes nz{to{transform:translateY(6px)}}
#scare .face{width:min(95vw,34vh);margin-top:auto;height:auto;animation:boo .7s cubic-bezier(.1,.9,.2,1)}
@keyframes boo{0%{transform:scale(.05);filter:brightness(6)}55%{transform:scale(1.3) rotate(-4deg);filter:brightness(2)}100%{transform:scale(1)}}
#scare .ui{margin:auto;opacity:0;animation:in .8s 2.4s forwards;max-width:380px;position:relative;z-index:2;background:rgba(0,0,0,.72);padding:16px}
#scare .sk{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:skin 2.8s cubic-bezier(.1,.8,.2,1) forwards,skj .09s steps(2) infinite}
@keyframes skin{0%{transform:scale(1.04);filter:brightness(3) contrast(1.4)}8%{filter:brightness(1.5) contrast(1.3)}60%{transform:scale(1.22);filter:brightness(1.15) contrast(1.3)}100%{transform:scale(1.28);filter:brightness(.3) contrast(1.2)}}
@keyframes skj{50%{translate:-6px 4px}}@keyframes in{to{opacity:1}}
.fxl{pointer-events:none;z-index:3}
.dr{stroke-dasharray:500;stroke-dashoffset:500;animation:dr .45s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.rg{transform-box:fill-box;transform-origin:center;animation:rg .6s forwards}@keyframes rg{from{transform:scale(.2);opacity:1}to{transform:scale(2.4);opacity:0}}
.fo{animation:fo .5s forwards}@keyframes fo{to{opacity:0}}
.mkf{animation:mf 1.2s forwards}@keyframes mf{60%{opacity:1}to{opacity:0}}
.flw{transform-box:fill-box;transform-origin:50% 100%;animation:flk 1.1s ease-in-out infinite alternate}
@keyframes flk{0%{transform:scale(1,1) skewX(-3deg)}35%{transform:scale(.9,1.18) skewX(4deg)}70%{transform:scale(1.08,.9) skewX(-5deg)}100%{transform:scale(.95,1.12) skewX(2deg)}}
.hd{transform-box:fill-box;transform-origin:50% 100%;animation:hrs 8s ease-in-out infinite}@keyframes hrs{0%,100%{transform:translateY(50px)}30%,62%{transform:translateY(0)}}
.fg{transform-box:fill-box;transform-origin:50% 100%;animation:cr 2.4s ease-in-out infinite alternate}@keyframes cr{to{transform:rotate(14deg)}}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 4s ease-in-out infinite alternate}@keyframes sw{to{transform:rotate(4deg)}}
.jw{transform-box:fill-box;transform-origin:50% 0;animation:jw 1.8s ease-in-out infinite alternate}@keyframes jw{to{transform:rotate(9deg)}}
.tw{transform-box:fill-box;transform-origin:50% 100%;animation:tw 2.6s steps(1) infinite}@keyframes tw{0%,70%{transform:none}74%{transform:rotate(-7deg)}80%{transform:rotate(6deg) translateX(2px)}86%{transform:none}92%{transform:rotate(-3deg)}}
.fh{animation:fh 5s ease-in-out infinite}@keyframes fh{50%{transform:translate(7px,-9px) skewX(3deg)}}
.clear .hd{animation:none;transform:translateY(60px);transition:transform 4s}
/* avanço de ataque por tipo de criatura */
.lunge.k-hv:not(.hit) .en{animation:lungeH .95s}@keyframes lungeH{0%{transform:none}35%{transform:scale(.9,.86) translateY(5px)}62%{transform:scale(1.26) translateY(-8px)}100%{transform:none}}
.lunge.k-gh:not(.hit) .en{animation:lungeG .75s}@keyframes lungeG{30%{transform:scaleX(.8) skewX(8deg);opacity:.55}60%{transform:scale(1.3,1.1);opacity:1;filter:blur(1px)}100%{transform:none}}
.lunge.k-dl:not(.hit) .en{animation:lungeD .6s steps(6)}@keyframes lungeD{30%{transform:rotate(-8deg) scale(.95)}60%{transform:rotate(7deg) scale(1.22) translateY(-5px)}100%{transform:none}}
.id{transform-box:fill-box;transform-origin:50% 100%;filter:drop-shadow(0 0 calc(6px + var(--fi,0)*5px) var(--c))}
.i-zum{animation:iz 3.4s ease-in-out infinite alternate}@keyframes iz{to{transform:rotate(1.8deg) translateY(2px)}}
.i-lad{animation:ilb 3s ease-in-out infinite}@keyframes ilb{50%{transform:scale(1.02,.98)}}
.i-cao{animation:ico 1.1s ease-in-out infinite}@keyframes ico{50%{transform:translateY(-4px) rotate(-1.4deg)}}
.i-vig{animation:ivg 5s ease-in-out infinite}@keyframes ivg{50%{transform:translateX(6px) skewX(-2deg);opacity:.8}}
.i-cul{animation:icu 2.2s ease-in-out infinite alternate}@keyframes icu{to{transform:rotate(-2.2deg)}}
.i-ati{animation:iat 4s ease-in-out infinite}@keyframes iat{50%{transform:translateY(-2px) scale(1.01)}}
.i-rat{animation:ira .5s steps(2) infinite}@keyframes ira{50%{transform:translateY(-2px) scaleY(1.025)}}
.i-gar{animation:igr 3.8s ease-in-out infinite}@keyframes igr{50%{transform:scale(1.035) translateY(-3px)}}
.i-fan{animation:ifa 4.5s ease-in-out infinite}@keyframes ifa{50%{transform:translate(6px,-12px) rotate(2.5deg);opacity:.7}}
.i-bon{animation:ibo 2.6s steps(1) infinite}@keyframes ibo{0%,70%{transform:none}74%{transform:rotate(-4deg)}80%{transform:rotate(3deg) translateX(2px)}86%{transform:none}92%{transform:rotate(-2deg)}}
.i-mad{animation:ima 1.7s ease-in-out infinite alternate}@keyframes ima{from{transform:scaleY(1);filter:drop-shadow(0 0 5px var(--c)) brightness(1)}to{transform:scaleY(.985);filter:drop-shadow(0 0 16px #ff9a3c) brightness(1.18)}}
.i-jak{animation:ijk 3.5s ease-in-out infinite alternate}@keyframes ijk{to{transform:translateY(-3px) scale(1.02)}}
.fr{opacity:0;animation:frs .52s steps(1,end) infinite}.fr.f0{opacity:1}
@keyframes frs{0%{opacity:1}25%{opacity:0}}
.id image{image-rendering:pixelated;image-rendering:-moz-crisp-edges}
.id{animation-timing-function:steps(8)!important}
.scn::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
.i-mer{animation:imr 3.2s ease-in-out infinite}@keyframes imr{50%{transform:translateY(-2px) scale(1.012)}}
.i-gmer{animation:igm 4s ease-in-out infinite}@keyframes igm{50%{transform:scale(1.015) translateY(-1px)}}
.i-pou{animation:ipo 3.6s ease-in-out infinite}@keyframes ipo{50%{transform:translateY(-1px) rotate(-.6deg)}}
.bgi{image-rendering:pixelated;image-rendering:-moz-crisp-edges;transform-box:fill-box;transform-origin:50% 100%;animation:bgd 26s ease-in-out infinite alternate}
@keyframes bgd{to{transform:scale(1.035)}}
.bgi.cf{animation:bgd 26s ease-in-out infinite alternate,cfl 2.4s steps(1) infinite}
@keyframes cfl{0%{filter:brightness(1)}18%{filter:brightness(1.14)}40%{filter:brightness(.94)}63%{filter:brightness(1.08)}82%{filter:brightness(.98)}}
#app{max-width:1260px}
#ttl{font:400 clamp(42px,6.2vw,68px)/1 'Pirata One',Georgia,serif;text-align:center;margin:4px 0 16px;color:var(--ink);letter-spacing:2px;text-shadow:0 0 22px rgba(192,36,59,.6),0 3px 0 #000}
#stage{display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,740px) minmax(190px,1fr);gap:16px;align-items:start}
#hud{display:contents;position:static}
#hl{grid-column:1;grid-row:1;justify-self:end;width:100%;max-width:250px}
#hr{grid-column:3;grid-row:1;justify-self:start;width:100%;max-width:250px}
#hl,#hr{position:sticky;top:12px;z-index:20}
#mid{grid-column:2;grid-row:1;min-width:0}
.hb{margin:0}.hb .nm{font:400 28px/1.1 'Pirata One',Georgia,serif;word-break:break-word}.hb .lv{color:var(--dim);margin-bottom:8px}
.hb .lab{display:flex;justify-content:space-between;gap:8px;font-size:14px}.hb .bar{height:14px;margin:4px 0 12px}.hb .bar.xp{height:8px}.hb .gd{font-size:20px;margin-top:2px}
#hud.off{visibility:hidden}
@media(max-width:1100px){#app{max-width:760px}#stage{display:block}#hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:0;z-index:20;margin-bottom:10px}#hud.off{display:none}#hl,#hr{position:static;max-width:none;grid-column:auto;grid-row:auto;justify-self:stretch}.hb{padding:8px 10px;background:#0d0609f2}.hb .nm{font-size:22px}.hb .lv{margin-bottom:4px;font-size:14px}.hb .bar{margin:3px 0 6px;height:10px}.hb .gd{font-size:16px}.hb .lab{font-size:13px}#ttl{margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#scare .ui{opacity:1}#scare .sk{filter:brightness(.4)}}
/* fundo: fogo em pixel art (base da tela) + sangue escorrendo (topo, reage à rolagem) */
.fog{opacity:.45}
#em{display:none}
#fire,#blood{position:fixed;left:0;pointer-events:none;image-rendering:pixelated;image-rendering:-moz-crisp-edges}
#fire{bottom:0;width:100%;height:50vh;z-index:0}
#blood{top:0;width:100%;height:100vh;z-index:-1}
</style>
</head>
<body>
<div class="fog"></div><div class="fog b"></div><div id="em"></div><canvas id="fire" aria-hidden="true"></canvas>
<div id="app"><canvas id="blood" aria-hidden="true"></canvas><h1 id="ttl">Caçada da Noite</h1><div id="stage"><div id="hud" class="off"><aside id="hl"></aside><aside id="hr"></aside></div><div id="mid"><div id="v"></div><div class="panel" id="lgp" style="display:none"><div id="lg"></div></div></div></div></div>
<button class="btn" id="snd" data-a="snd" aria-label="Som">🔊</button>
<div id="start"><h1>Caçada da Noite</h1><button class="btn main" id="startb">Entrar na noite</button></div><div id="story" tabindex="-1"><div class="st"></div><div class="sb"></div><button class="btn main" disabled>Continuar</button><small class="sk2">clique para mostrar o texto todo</small></div><div id="fx"></div><div id="scare"></div>
<script>
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EL={sangue:{n:'Sangue',c:'#d6344c'},natureza:{n:'Natureza',c:'#6aa84f'},sombra:{n:'Sombra',c:'#9a7fe6'},pureza:{n:'Pureza',c:'#e6d596'}};
const ED={sangue:'Drena a vida do alvo. Forte contra Natureza.',natureza:'Espinhos e veneno. Forte contra Sombra.',sombra:'Trevas e pavor. Forte contra Pureza.',pureza:'Luz e correntes. Forte contra Sangue.'};
const BEATS={sangue:'natureza',natureza:'sombra',sombra:'pureza',pureza:'sangue'};
const mult=(a,d)=>BEATS[a]===d?1.5:BEATS[d]===a?.65:1;
const TY={perf:'Perfurante',cort:'Cortante',cont:'Contundente'};
const WD={pistola:'Tiros à distância. Rajadas e balas perfurantes.',espada:'Cortes rápidos. Sangramento e golpes duplos.',chicote:'Golpes pesados. Laços que atordoam.'};
// ---------- DADOS ----------
const SK={
tiro:{n:'Tiro Preciso',k:'phys',type:'perf',p:1,cd:0},rajada:{n:'Rajada de Disparos',k:'phys',type:'perf',p:.45,hits:3,cd:2,pr:60},bala:{n:'Bala Perfurante',k:'phys',type:'perf',p:1.9,cd:3,pr:80},
corte:{n:'Corte Direto',k:'phys',type:'cort',p:1,cd:0},talho:{n:'Talho Sangrento',k:'phys',type:'cort',p:1.1,cd:2,fx:['bleed'],pr:60},duplo:{n:'Golpe Duplo',k:'phys',type:'cort',p:.7,hits:2,cd:2,pr:70},

<script>
/* ===== FUNDO: FOGO EM PIXEL ART + SANGUE ESCORRENDO =====
   Ajustes rápidos:
   PX        tamanho do "pixel" na tela (maior = mais quadradão)
   CAPFRAC   até que altura da tela o sangue pode descer (0.22 = 22%)
   O sangue só aparece na tela de criação do personagem e acompanha a rolagem (desce e sobe junto). */
(()=>{
const PX=4,CAPFRAC=.22,R=Math.random,RMO=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- FOGO (algoritmo clássico de fogo em grade, mais alto nas laterais) ---------- */
const fc=document.getElementById('fire'),fx=fc.getContext('2d'),MAXH=36,PAL=new Uint32Array(MAXH+1);
(()=>{const S=[[0,0,0,0,0],[3,50,0,8,60],[10,120,10,22,165],[18,190,34,38,205],[26,238,98,30,225],[32,255,168,52,236],[36,255,226,130,245]];
for(let i=0;i<=MAXH;i++){let k=1;while(k<S.length-1&&S[k][0]<i)k++;const a=S[k-1],b=S[k],t=(i-a[0])/(b[0]-a[0]),c=j=>Math.round(a[j]+(b[j]-a[j])*t);PAL[i]=((c(4)<<24)|(c(3)<<16)|(c(2)<<8)|c(1))>>>0}})();
let fw=0,fh=0,heat,fimg,f32,ac,sparks=[];
function fireStep(t){const w=fw,h=fh,last=(h-1)*w;
for(let x=0;x<w;x++){heat[last+x]=MAXH;const e=Math.abs(x/(w-1)*2-1);ac[x]=1.25-.75*Math.pow(e,.8)+.22*Math.sin(t*1.7+x*.11)}
for(let y=1;y<h;y++)for(let x=0;x<w;x++){const v=heat[y*w+x];if(!v)continue;const a=ac[x],b=a|0,d=b+(R()<a-b?1:0),nx=Math.min(w-1,Math.max(0,x+((R()*3)|0)-1)),nv=v-d;heat[(y-1)*w+nx]=nv>0?nv:0}}
function sparkStep(){
if(sparks.length<46&&R()<.5){const e=R()<.7?(R()<.5?R()*.3:1-R()*.3):R();sparks.push({x:e*fw,y:fh-3-R()*18,vx:(R()-.5)*.5,vy:-(.5+R()*.9),l:1})}
for(const s of sparks){s.x+=s.vx+Math.sin(s.y*.25+s.l*6)*.18;s.y+=s.vy;s.l-=.012+R()*.01}
sparks=sparks.filter(s=>s.l>0&&s.y>0)}
function fireDraw(){for(let i=0;i<heat.length;i++)f32[i]=PAL[heat[i]];fx.putImageData(fimg,0,0);
for(const s of sparks){fx.fillStyle=s.l>.6?'#ffe27a':s.l>.3?'#ff9a2e':'#c0243b';fx.fillRect(s.x|0,s.y|0,1,1)}}
function fireInit(){const w=Math.ceil(innerWidth/PX),h=Math.ceil(Math.max(innerHeight,360)*.5/PX);
if(w===fw&&Math.abs(h-fh)<fh*.25)return;
fw=w;fh=h;fc.width=w;fc.height=h;fc.style.width=w*PX+'px';fc.style.height=h*PX+'px';
heat=new Uint8Array(w*h);ac=new Float32Array(w);fimg=fx.createImageData(w,h);f32=new Uint32Array(fimg.data.buffer);sparks=[];
for(let i=0;i<70;i++)fireStep(i*.06)}

/* ---------- SANGUE (cresce com a rolagem para baixo) ---------- */
const bc=document.getElementById('blood'),bx=bc.getContext('2d');
let bw=0,bh=0,dr=[],crust=[],vis=0;
function bloodInit(){const w=Math.ceil(innerWidth/PX),h=Math.ceil(innerHeight/PX);
bh=h;bc.height=h;bc.style.height=h*PX+'px';
if(w===bw)return;
bw=w;bc.width=w;bc.style.width=w*PX+'px';dr=[];crust=[];let x=1,c=2;
for(let i=0;i<w;i++){c=Math.max(1,Math.min(3,c+((R()*3)|0)-1));crust[i]=c}
while(x<w-2){const wd=[1,1,2,2,3][(R()*5)|0],base=1+R()*4;dr.push({x,w:wd,base,k:.008+R()*.022,sp:16+R()*26,len:base,drop:null});x+=wd+4+((R()*14)|0)}}
function bloodStep(dt){const cap=bh*CAPFRAC,sy=Math.max(0,scrollY);
for(const d of dr){const t=Math.min(cap,d.base+sy*d.k),m=t-d.len;
d.len+=Math.sign(m)*Math.min(Math.abs(m),d.sp*dt);
const p=d.drop;
if(p){p.v=Math.min(70,p.v+90*dt);p.y+=p.v*dt;if(p.y>p.end)d.drop=null}
else if(d.len>5&&R()<dt*(.08+(m>.5?.4:0)))d.drop={y:d.len+1,y0:d.len+1,v:6,end:Math.min(bh,d.len+14+R()*40)}}}
function bloodDraw(){bx.clearRect(0,0,bw,bh);
for(let x=0;x<bw;x++){const c=crust[x];bx.fillStyle='#5a0a14';bx.fillRect(x,0,1,c);bx.fillStyle='#8a1428';bx.fillRect(x,0,1,c-1);if(x%6===2){bx.fillStyle='#d6344c';bx.fillRect(x,1,1,1)}}
for(const d of dr){const r=d.len|0,x=d.x,w=d.w;if(r<1)continue;
bx.fillStyle='#a31428';bx.fillRect(x,0,w,r);
bx.fillStyle='#5a0a14';bx.fillRect(x+w-1,0,1,r);
if(w>1){bx.fillStyle='#d6344c';bx.fillRect(x,3,1,Math.max(0,r-3))}
if(r>7){bx.fillStyle='#a31428';bx.fillRect(x-1,r-3,w+2,3);bx.fillRect(x,r,w,1);
bx.fillStyle='#5a0a14';bx.fillRect(x+w,r-3,1,3);bx.fillRect(x+w-1,r,1,1);
bx.fillStyle='#d6344c';bx.fillRect(x-1,r-3,1,2)}
const p=d.drop;
if(p){const px=x+(w>>1),a=1-(p.y-p.y0)/(p.end-p.y0);bx.globalAlpha=a<0?0:a;bx.fillStyle='#a31428';bx.fillRect(px,p.y|0,1,2);bx.fillStyle='#d6344c';bx.fillRect(px,p.y|0,1,1);bx.globalAlpha=1}}}

/* ---------- LOOP E EVENTOS ---------- */
let ft=0,pt=0;
function loop(ts){requestAnimationFrame(loop);if(document.hidden)return;
const dt=Math.min(.05,(ts-pt)/1000||0);pt=ts;
if(ts-ft>=60){ft=ts;fireStep(ts/1000);sparkStep();fireDraw()}
const on=typeof vCreate==='function'&&view===vCreate;vis+=((on?1:0)-vis)*Math.min(1,dt*6);
if(vis<.01){if(bc.style.opacity!=='0')bc.style.opacity='0';return}
bc.style.opacity=vis.toFixed(2);bloodStep(dt);bloodDraw()}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{fireInit();bloodInit();if(RMO)fireDraw()},150)});
fireInit();bloodInit();
if(RMO){fireDraw();bc.style.display='none'}else requestAnimationFrame(loop);
})();
</script>
</body>
